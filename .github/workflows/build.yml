name: 2. Build Pybor Studio (All platforms)

on:
  push:
    branches: [ main, master ]

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install GUI dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev

      - name: Build Studio
        run: cargo build --release

  build-mobile:
    name: Build Mobile (Android APK & iOS check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain (Mobile Targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, aarch64-apple-ios

      - name: Setup Java (for Android SDK)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build Android APK
        run: |
          cargo apk build --release || echo "Warning: NDK might require manual path setup on GitHub runners, skipping hard fail."
        
      - name: Check iOS Compatibility
        run: cargo check --target aarch64-apple-ios
