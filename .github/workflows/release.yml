name: Release Pybor 1.0.0-ALPHA

on:
  push:
    tags:
      - 'v*'

# 🚀 TÍMTO OPRAVÍME ERROR 403! Dáme botovi práva vytvářet Releases.
permissions:
  contents: write

jobs:
  build_release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pybor
            asset_name: pybor-linux-amd64
          - os: windows-latest
            artifact: pybor.exe
            asset_name: pybor-windows
          - os: macos-latest
            artifact: pybor
            asset_name: pybor-macos-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Přidáme metadata do Cargo.toml (potřebné pro Linuxový .deb balíček)
      - name: Fix Cargo.toml for .deb building
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo 'description = "Pybor OS Compiler"' >> Cargo.toml
          echo 'license = "MIT"' >> Cargo.toml

      - name: Build Pybor
        run: cargo build --release

      # 🐧 Vytvoření .deb instalačky pro Linux
      - name: Build .deb package (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb
          cargo deb
          cp target/debian/*.deb ./pybor-linux.deb

      # 🪟 Zabalení Windows .exe pomocí PowerShellu
      - name: Pack Windows (PowerShell)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\release\${{ matrix.artifact }} ${{ matrix.asset_name }}.exe
          Compress-Archive -Path ${{ matrix.asset_name }}.exe -DestinationPath ${{ matrix.asset_name }}.zip

      # 🍎 Zabalení Macu a normálního Linuxu
      - name: Pack Linux/Mac (Bash)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/release/${{ matrix.artifact }} ${{ matrix.asset_name }}
          zip ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}

      # 🚀 Nahrání vydání (verze v2 vyřeší ty Node.js warningy)
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.deb
          name: Pybor 1.0.0 (ALPHA)
          body: |
            # Pybor 1.0.0-ALPHA 🚀
            První veřejná alpha verze revolučního Pybor kompilátoru! Nyní plně nezávislý na NASMu a s podporou UEFI i BIOSu.
            
            ### Instalační soubory:
            * **Windows:** Stáhněte si `pybor-windows.zip` a spusťte `.exe` z terminálu/příkazové řádky!
            * **Linux (Debian/Ubuntu):** Stáhněte a nainstalujte `pybor-linux.deb` (např. přes `sudo apt install ./pybor-linux.deb`). Pak můžete pybor volat odkudkoliv příkazem `pybor`.
            * **MacOS:** Stáhněte Mac verzi a spusťte v terminálu.
          draft: false
          prerelease: true
