name: 3. Vydání (Release)

on:
  push:
    tags:
      - 'v*' # Spustí se jen při vydání, např. git tag v1.0.0

permissions:
  contents: write

jobs:
  publish-assets:
    name: Zabalení a Publikace
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: pybor.exe
            asset_name: Pybor-Studio-Windows.exe
          - os: ubuntu-latest
            artifact: pybor
            asset_name: Pybor-Studio-Linux
          - os: macos-latest
            artifact: pybor
            asset_name: Pybor-Studio-MacOS

    steps:
      - uses: actions/checkout@v4
      - name: Instalace Rustu
        uses: dtolnay/rust-toolchain@stable
        
      - name: Instalace GUI závislostí (Pouze Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev

      - name: Build pro Vydání
        run: cargo build --release

      - name: Přejmenování souborů k vydání
        shell: bash
        run: |
          cp target/release/${{ matrix.artifact }} ${{ matrix.asset_name }}
          zip ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}

      - name: Nahrát na GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          draft: false
          prerelease: true
