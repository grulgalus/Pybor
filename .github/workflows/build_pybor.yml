name: Build and Test Pybor OS

on:
  push:
    branches: [ main, master ]

jobs:
  build_compiler_and_os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linkers (No more NASM!)
        run: sudo apt-get install -y binutils lld

      - name: Build Pybor Compiler
        run: cargo build --release

      - name: Create Pybor Bootloader Test file
        run: |
          mkdir -p test_os/boot
          echo "def bootloader_main():" > test_os/boot/boot.pyb
          echo "    poke8(0xb8000, 0x50) # 'P'" >> test_os/boot/boot.pyb
          echo "    hang()" >> test_os/boot/boot.pyb

      - name: Build BIOS Bootloader (x86_16) direct to .bin
        run: |
          mkdir -p test_os/x86_16
          # 🚀 Tady z tvého boot.pyb rovnou leze 512B bootovací sektor! Žádný Linker, žádný NASM!
          ./target/release/pybor x86_16 test_os/boot/boot.pyb test_os/x86_16/bootsector.bin
          echo "✅ BIOS Bootloader je připraven a nabootuje z flešky!"

      - name: Build Kernel for old x86_32 (ELF)
        run: |
          mkdir -p test_os/x86_32
          ./target/release/pybor x86_32 test_os/kernel/kernel.pyb test_os/x86_32/kernel.o
          echo "✅ x86_32 ELF Kernel připraven k linkování!"

      - name: Build UEFI Application for x86_64 (PE32+)
        run: |
          mkdir -p test_os/x86_64
          ./target/release/pybor x86_64 test_os/kernel/kernel.pyb test_os/x86_64/kernel.obj
          lld-link -subsystem:efi_application -entry:efi_main -out:test_os/x86_64/BOOTX64.EFI test_os/x86_64/kernel.obj
          echo "✅ UEFI BOOTX64.EFI je na světě!"

      - name: Build ARM Architectures (ELF)
        run: |
          mkdir -p test_os/arm32 test_os/arm64
          ./target/release/pybor arm32 test_os/kernel/kernel.pyb test_os/arm32/kernel.o
          ./target/release/pybor arm64 test_os/kernel/kernel.pyb test_os/arm64/kernel.o
          echo "✅ ARM a ARM64 objekty vytvořeny!"
