name: Build and Test Pybor

on:
  push:
    branches: [ main, master ]

jobs:
  build_compiler_and_os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bootloader Assembler & Linker
        run: sudo apt-get install -y nasm binutils

      - name: Build REAL Pybor Compiler
        run: cargo build --release

      - name: Pybor -> Real Object File (NO NASM!)
        run: |
          mkdir -p test_os/x86_32
          # Odtud vypadne rovnou kernel.o, NASM je mrtev!
          ./target/release/pybor x86_32 test_os/kernel/kernel.pyb test_os/x86_32/kernel.o

      - name: Link OS
        run: |
          nasm -f elf32 test_os/boot/boot.asm -o test_os/boot/boot.o
          ld -m elf_i386 -T test_os/scripts/linker.ld -o test_os/my_kernel.bin test_os/boot/boot.o test_os/x86_32/kernel.o
          echo "✅ Úspěch: Slinkovali jsme binárku z reálných bajtů Pyboru!"
