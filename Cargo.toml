[package]
name = "pybor"
version = "0.1.0"
edition = "2021"

[dependencies]
object = { version = "0.36", features = ["write"] }
eframe = "0.24"
rfd = "0.12"
fatfs = "0.3"
fscommon = "0.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef"] }

[package.metadata.android]
apk_name = "PyborStudio"
assets = "assets"
